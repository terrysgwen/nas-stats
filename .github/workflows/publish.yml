name: Build and Push nas-stats1 to Docker Hub

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. 构建并推送镜像
        run: |
          # 假设你的 Dockerfile 就在 nas-stats1 根目录下
          # 镜像名称会自动命名为你的 Docker Hub 用户名/nas-stats1:latest
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/nas-stats1:latest"
          
          echo "开始构建镜像: $IMAGE_NAME"
          docker build -t "$IMAGE_NAME" .
          
          echo "推送到 Docker Hub..."
          docker push "$IMAGE_NAME"