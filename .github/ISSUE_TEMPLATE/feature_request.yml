name: 💡 功能建议 (Feature Request)
description: 为 NAS-Stats 提出新功能构想或使用体验优化建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎为 NAS-Stats 提供有价值的建议！
        **请注意：本项目所有 Issues 与讨论交流请全程使用中文。**
  - type: textarea
    id: background
    attributes:
      label: 需求背景与痛点
      description: 为什么需要这个功能？当前在使用过程中遇到了什么不便？
      placeholder: 例如：当接入多个不同内网网段服务时，现有的监控模块缺少对...的支持。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 您希望此功能具体如何工作？界面如何呈现？
      placeholder: 请详细描述您设想的功能细节、配置项或交互方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或备选思路
      description: 您是否考虑过其他可行的替代方案？
      placeholder: 描述其他曾经考虑过的替代方案或临时解决手段。
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息与参考截图
      description: 如有相关 API 文档链接、类似软件参考或界面草图，可在此提供。
      placeholder: 粘贴链接或上传参考截图
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认
      options:
        - label: 我已确认此前未有人提出过类似的功能建议。
          required: true
        - label: 我确认本 Issue 内容全程使用中文描述。
          required: true
