<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d13">
<title>实时监控中心 v2.5.2</title>
<style>
  :root{
    --bg:#0b0d13;
    --fg:#f1f3f9;
    --muted:#8b92a5;
    --bar:rgba(11,13,19,.78);
    --line:rgba(255,255,255,.14);
    --accent:#3b82f6;
    --danger:#ef4444;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;background:var(--bg);overflow:hidden;}
  #wall{
    width:100%;height:100%;border:0;display:block;background:var(--bg);
  }

  /* ── 悬浮控制条（默认半透明，鼠标移上去才完全不透明） ── */
  #bar{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;
    padding:7px 9px;border-radius:999px;
    background:var(--bar);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    font:13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--fg);opacity:.26;transition:opacity .18s ease;z-index:99;
    max-width:calc(100vw - 24px);
  }
  #bar:hover,#bar.show{opacity:1;}
  #bar a,#bar button{
    display:inline-flex;align-items:center;justify-content:center;
    height:30px;padding:0 12px;border-radius:999px;
    border:1px solid transparent;background:transparent;
    color:var(--fg);font:inherit;text-decoration:none;cursor:pointer;
    white-space:nowrap;transition:background .15s,border-color .15s;
  }
  #bar a:hover,#bar button:hover{background:rgba(255,255,255,.12);border-color:var(--line);}
  #bar .sep{width:1px;height:18px;background:var(--line);margin:0 2px;}
  #bar .primary{background:rgba(59,130,246,.22);border-color:rgba(59,130,246,.45);}
  #bar .primary:hover{background:rgba(59,130,246,.34);}

  /* ── 状态/错误浮层 ── */
  #mask{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(11,13,19,.94);z-index:120;padding:24px;text-align:center;
    font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);
  }
  #mask.on{display:flex;}
  #mask .box{max-width:520px;}
  #mask h2{margin:0 0 10px;font-size:17px;font-weight:600;}
  #mask p{margin:0 0 6px;color:var(--muted);word-break:break-all;}
  #mask code{
    display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;
    background:rgba(255,255,255,.07);border:1px solid var(--line);
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#c9d1e5;
  }
  #mask .acts{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  #mask .acts button,#mask .acts a{
    height:34px;padding:0 16px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--fg);font:13px/1 -apple-system,sans-serif;
    cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;
  }
  #mask .acts .primary{background:rgba(59,130,246,.25);border-color:rgba(59,130,246,.5);}
  #spinner{
    width:26px;height:26px;margin:0 auto 14px;border-radius:50%;
    border:2px solid rgba(255,255,255,.16);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 手机：控制条贴底、可换行 */
  @media (max-width:640px){
    #bar{bottom:10px;gap:4px;padding:6px 7px;}
    #bar a,#bar button{height:28px;padding:0 9px;font-size:12px;}
    #bar .opt{display:none;}
  }

  /* ── 一次性登录提示 toast ── */
  #toast{
    position:fixed;left:50%;top:18px;transform:translate(-50%,-14px);
    max-width:min(560px,calc(100vw - 24px));padding:11px 15px;border-radius:12px;
    background:rgba(30,41,59,.96);border:1px solid rgba(96,165,250,.45);
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e6ebf7;z-index:130;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  }
  #toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  #toast b{color:#93c5fd;}
  #toast .x{
    position:absolute;top:6px;right:8px;width:22px;height:22px;border:0;background:transparent;
    color:#94a3b8;font:16px/1 sans-serif;cursor:pointer;border-radius:6px;
  }
  #toast .x:hover{background:rgba(255,255,255,.12);color:#fff;}
</style>
</head>
<body>

<iframe id="wall"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
        referrerpolicy="no-referrer"></iframe>

<div id="bar" class="show">
  <a href="/" title="返回服务导航">← 导航</a>
  <span class="sep"></span>
  <button class="opt" onclick="switchPage('home')">总览</button>
  <button class="opt" onclick="switchPage('preview')">多画面</button>
  <button class="opt" onclick="switchPage('record')">录像</button>
  <span class="sep opt"></span>
  <button onclick="reloadWall()" title="重新加载">⟳ 刷新</button>
  <a id="openNew" href="#" target="_blank" rel="noopener" title="在新窗口打开 EasyNVR">原厂 ↗</a>
</div>

<div id="toast">
  <button class="x" onclick="document.getElementById('toast').classList.remove('on')">×</button>
  <span>首次进入若显示 <b>Login</b> 页：直接在当前画面里登录即可（账号密码 + 图形验证码）。登录一次浏览器会记住会话，以后打开直接进监控墙。</span>
</div>

<div id="mask">
  <div class="box">
    <div id="spinner"></div>
    <h2 id="maskTitle">正在连接 EasyNVR…</h2>
    <p id="maskMsg"></p>
    <code id="maskUrl"></code>
    <div class="acts">
      <button class="primary" onclick="reloadWall()">重试</button>
      <a id="maskOpen" href="#" target="_blank" rel="noopener">新窗口打开</a>
      <a href="/">返回导航</a>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var qs        = new URLSearchParams(location.search);
  var PAGE      = qs.get('page') || 'preview';   // preview | home | record | alarm …
  var FORCE_SRC = qs.get('src')   || '';         // ?src=http://ip:port 强制指定 EasyNVR 地址
  var TIMEOUT   = parseInt(qs.get('timeout') || '9000', 10);

  var wall     = document.getElementById('wall');
  var mask     = document.getElementById('mask');
  var maskT    = document.getElementById('maskTitle');
  var maskM    = document.getElementById('maskMsg');
  var maskU    = document.getElementById('maskUrl');
  var openNew  = document.getElementById('openNew');
  var maskOpen = document.getElementById('maskOpen');
  var base     = '';
  var loaded   = false;

  // ── 1. 解析 EasyNVR 基地址 ──────────────────────────────────────
  // 优先级：?src= 参数 > nas-stats 的 easynvr 监控配置 > 同主机 :10000
  function resolveBase() {
    if (FORCE_SRC) return Promise.resolve(FORCE_SRC.replace(/\/+$/, ''));

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 3000);

    return fetch('/api/monitors', { cache: 'no-store', signal: ctrl.signal })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return null;
        var list = Array.isArray(j) ? j : (j.items || j.monitors || j.data || []);
        if (!Array.isArray(list)) return null;
        for (var i = 0; i < list.length; i++) {
          var m = list[i] || {};
          if (String(m.id || '').toLowerCase() !== 'easynvr') continue;
          var cfg = m.config || {};
          if (typeof cfg === 'string') { try { cfg = JSON.parse(cfg); } catch (e) { cfg = {}; } }
          if (cfg.url) return String(cfg.url).replace(/\/+$/, '');
        }
        return null;
      })
      .catch(function () { return null; })
      .finally(function () { clearTimeout(timer); })
      .then(function (u) {
        if (u) return u;
        // 兜底：同主机 10000（EasyNVR 默认端口）
        return location.protocol + '//' + location.hostname + ':10000';
      });
  }

  // ── 2. 混合内容拦截预判 ────────────────────────────────────────
  function mixedContentBlocked(url) {
    return location.protocol === 'https:' && /^http:\/\//i.test(url);
  }

  // ── 3. 组装 EasyNVR 内部地址 ───────────────────────────────────
  function buildUrl(b, page) {
    // /cloud/ 是 umi SPA，hash 路由：#/preview、#/home、#/record、#/alarm …
    return b + '/cloud/#/' + (page || 'preview');
  }

  function showMask(title, msg, url, spin) {
    maskT.textContent = title;
    maskM.textContent = msg || '';
    maskU.textContent = url || '';
    maskU.style.display = url ? 'inline-block' : 'none';
    document.getElementById('spinner').style.display = spin ? 'block' : 'none';
    mask.classList.add('on');
  }

  function hideMask() { mask.classList.remove('on'); }

  var toastTimer = null;
  function showLoginToast() {
    if (qs.get('notoast') === '1') return;
    // 同一标签页只提示一次
    try { if (sessionStorage.getItem('nvrWallToast') === '1') return; sessionStorage.setItem('nvrWallToast', '1'); } catch (e) {}
    var t = document.getElementById('toast');
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 9000);
  }

  // ── 4. 加载 ────────────────────────────────────────────────────
  function loadWall() {
    loaded = false;
    showMask('正在连接 EasyNVR…', '', '', true);

    resolveBase().then(function (b) {
      base = b;
      var url = buildUrl(base, PAGE);

      openNew.href  = url;
      maskOpen.href = url;

      if (mixedContentBlocked(base)) {
        showMask(
          '浏览器阻止了不安全内容',
          '当前页面是 https，而 EasyNVR 是 http，浏览器会按「混合内容」直接拦截。' +
          '解决办法：用 http 方式访问本页，或先给 EasyNVR 也套一层 https 反代。',
          base, false
        );
        return;
      }

      wall.src = url;

      // 跨域无法读取 iframe 内部状态，只能靠 onload + 超时兜底
      var fired = false;
      var t = setTimeout(function () {
        if (fired || loaded) return;
        fired = true;
        showMask(
          '连接 EasyNVR 超时',
          'iframe 在 ' + Math.round(TIMEOUT / 1000) + ' 秒内没有加载完成。请确认 EasyNVR 正在运行、端口可达。',
          url, false
        );
      }, TIMEOUT);

      wall.onload = function () {
        if (fired) return;
        fired = true;
        clearTimeout(t);
        loaded = true;
        hideMask();
        // EasyNVR 是 SPA，iframe 加载完可能停在 #/login —— 跨域无法探测，
        // 用一条一次性 toast 告知用户「按需登录（需验证码）」。
        setTimeout(showLoginToast, 1200);
      };

      wall.onerror = function () {
        clearTimeout(t);
        showMask('无法加载 EasyNVR', 'iframe 报错，检查地址是否可访问。', url, false);
      };
    });
  }

  // ── 5. 对外操作 ────────────────────────────────────────────────
  window.reloadWall = function () {
    if (!base) { loadWall(); return; }
    hideMask();
    loaded = false;
    // 强制重载：先清空再赋值，避免同 URL 不触发导航
    wall.src = 'about:blank';
    setTimeout(function () { wall.src = buildUrl(base, PAGE); }, 60);
  };

  window.switchPage = function (page) {
    PAGE = page;
    var u = new URL(location.href);
    u.searchParams.set('page', page);
    history.replaceState(null, '', u.toString());
    reloadWall();
  };

  // 控制条：3 秒后淡出，鼠标靠近底部时重新显现
  var bar = document.getElementById('bar');
  var fadeTimer = setTimeout(function () { bar.classList.remove('show'); }, 3000);
  document.addEventListener('mousemove', function (e) {
    if (e.clientY > window.innerHeight - 110) {
      bar.classList.add('show');
      clearTimeout(fadeTimer);
    } else {
      clearTimeout(fadeTimer);
      fadeTimer = setTimeout(function () { bar.classList.remove('show'); }, 2200);
    }
  }, { passive: true });

  // 键盘：r 刷新，1/2/3 切页
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'r' || e.key === 'R') reloadWall();
    if (e.key === '1') switchPage('home');
    if (e.key === '2') switchPage('preview');
    if (e.key === '3') switchPage('record');
  });

  loadWall();
})();
</script>
</body>
</html>
