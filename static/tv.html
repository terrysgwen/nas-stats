<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAS Stats • Apple tvOS 电视大屏控制台 v2.5.0</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tvos: {
              card: 'rgba(255, 255, 255, 0.08)',
              border: 'rgba(255, 255, 255, 0.15)',
              focusBorder: 'rgba(255, 255, 255, 0.75)',
              glow: 'rgba(255, 255, 255, 0.25)',
              badge: 'rgba(0, 0, 0, 0.45)',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Icons"', '"PingFang SC"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          boxShadow: {
            'tvos-float': '0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 255, 255, 0.2)',
            'tvos-glow': '0 0 20px rgba(255, 255, 255, 0.3)',
          }
        }
      }
    }
  </script>
  <style>
    /* 核心 tvOS 平滑光影与背景设定 */
    body {
      background: radial-gradient(circle at 50% 15%, #182236 0%, #0c1019 55%, #05070a 100%);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    /* tvOS 连续 Squircle 拟态平滑圆角卡片 */
    .tvos-card {
      border-radius: 22px;
      transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.28s cubic-bezier(0.2, 0.9, 0.3, 1), border-color 0.2s ease;
      transform-style: preserve-3d;
      perspective: 800px;
      outline: none;
      position: relative;
    }

    /* 聚焦状态 (Hover / 键盘遥控器聚焦) */
    .tvos-card.focused, .tvos-card:hover {
      transform: scale(1.11) translateY(-6px);
      box-shadow: 0 22px 42px -8px rgba(0, 0, 0, 0.8), 0 0 0 2.5px rgba(255, 255, 255, 0.95), 0 10px 30px rgba(255, 255, 255, 0.25);
      z-index: 40;
    }

    .tvos-card.focused .card-title, .tvos-card:hover .card-title {
      opacity: 1;
      transform: translateY(2px);
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* 模拟 tvOS 镜面流光层 (Glare) */
    .card-glare {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 65%);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: overlay;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .tvos-card.focused .card-glare, .tvos-card:hover .card-glare {
      opacity: 1;
    }

    /* 滚动条隐藏与平滑滚动 */
    ::-webkit-scrollbar {
      display: none;
    }
    html {
      scrollbar-width: none;
    }

    /* 动态展台淡入淡出动画 */
    @keyframes shelfFade {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }
    .shelf-animate {
      animation: shelfFade 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 正在播放动画波浪 */
    @keyframes barRise {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
    .wave-bar:nth-child(1) { animation: barRise 1s infinite ease-in-out; }
    .wave-bar:nth-child(2) { animation: barRise 1.2s infinite ease-in-out 0.2s; }
    .wave-bar:nth-child(3) { animation: barRise 0.8s infinite ease-in-out 0.4s; }
    .wave-bar:nth-child(4) { animation: barRise 1.1s infinite ease-in-out 0.1s; }
  </style>
</head>

<body class="min-h-screen text-slate-100 flex flex-col justify-between selection:bg-blue-500/30 selection:text-white">

  <!-- ================= 顶部全局控制栏 (Top Bar) ================= -->
  <header class="sticky top-0 z-50 backdrop-blur-2xl bg-black/40 border-b border-white/10 px-6 lg:px-10 py-3 flex items-center justify-between">
    <!-- 左侧：媒体播放微型胶囊与快捷搜索 -->
    <div class="flex items-center space-x-3.5">
      <div id="mediaCapsule" onclick="window.location.href='/'" class="flex items-center space-x-3 bg-white/10 hover:bg-white/15 px-3.5 py-1.5 rounded-full border border-white/10 transition backdrop-blur-md cursor-pointer group" title="点击呼出主控播放">
        <div class="flex items-end space-x-0.5 h-4 w-4 justify-center">
          <span class="w-1 bg-green-400 rounded-full wave-bar"></span>
          <span class="w-1 bg-green-400 rounded-full wave-bar"></span>
          <span class="w-1 bg-green-400 rounded-full wave-bar"></span>
          <span class="w-1 bg-green-400 rounded-full wave-bar"></span>
        </div>
        <div class="flex flex-col text-xs pr-1">
          <span id="headerMusicTitle" class="font-medium text-white/95 group-hover:text-green-300 transition leading-tight truncate max-w-[150px]">飞牛音乐</span>
          <span id="headerMusicSub" class="text-[10px] text-white/50 leading-tight">fnOS 媒体中心 · 就绪</span>
        </div>
      </div>
      
      <!-- 搜索栏 (Spotlight 胶囊) -->
      <div class="relative hidden sm:block">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-white/40"></i>
        <input id="searchInput" type="text" placeholder="搜索应用或服务..." 
               class="bg-white/10 text-xs text-white pl-9 pr-4 py-1.5 rounded-full border border-white/10 focus:border-white/50 focus:bg-white/15 focus:outline-none transition w-48 focus:w-64 placeholder-white/40">
      </div>
    </div>

    <!-- 中间：Apple TV OS 风格实时状态监测胶囊 (真实接入 /api/stats) -->
    <div class="hidden lg:flex items-center space-x-2.5 text-xs">
      <!-- 流量吞吐 -->
      <div class="flex items-center space-x-2 bg-white/5 px-3.5 py-1.5 rounded-full border border-white/10">
        <i class="fa-solid fa-arrow-down text-emerald-400 text-[10px]"></i>
        <span class="font-mono text-white/90" id="statDown">0.0 B/s</span>
        <i class="fa-solid fa-arrow-up text-blue-400 text-[10px] ml-1"></i>
        <span class="font-mono text-white/90" id="statUp">0.0 B/s</span>
      </div>

      <!-- PVE / 节点资源 -->
      <div id="statPveBox" class="flex items-center space-x-2 bg-white/5 px-3.5 py-1.5 rounded-full border border-white/10 font-mono">
        <span class="text-white/50 text-[11px]">PVE CPU</span>
        <span class="text-amber-300 font-semibold" id="statPveCpu">--%</span>
        <span class="text-white/20">|</span>
        <span class="text-white/50 text-[11px]">RAM</span>
        <span class="text-emerald-300 font-semibold" id="statPveMem">--/--G</span>
      </div>

      <!-- 智能管家 / 监控 -->
      <div id="statHaBox" class="flex items-center space-x-1.5 bg-white/5 px-3.5 py-1.5 rounded-full border border-white/10 text-white/80">
        <i class="fa-solid fa-house-signal text-amber-400 text-[11px]"></i>
        <span id="statHaText">HA 智能管家</span>
      </div>
    </div>

    <!-- 右侧：遥控器指引与时间时钟 -->
    <div class="flex items-center space-x-4">
      <div class="hidden xl:flex items-center space-x-1.5 text-xs text-white/40 bg-white/5 px-2.5 py-1 rounded-full border border-white/5">
        <i class="fa-solid fa-arrows-up-down-left-right text-[10px]"></i>
        <span>方向键导航</span>
        <kbd class="px-1.5 py-0.5 bg-white/10 text-white/80 rounded text-[10px]">Enter</kbd>
        <span>启动</span>
      </div>

      <!-- 返回常规控制台按钮 -->
      <a href="/" class="flex items-center space-x-1 text-xs text-white/70 hover:text-white bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full border border-white/15 transition backdrop-blur-md">
        <i class="fa-solid fa-house text-[11px]"></i>
        <span>常规面板</span>
      </a>
      
      <!-- 当前时间显示 -->
      <div class="text-right flex items-center space-x-3">
        <div class="text-right">
          <div id="liveClock" class="font-semibold text-sm tracking-tight text-white/95">--:--</div>
          <div id="liveDate" class="text-[10px] text-white/50">--月--日</div>
        </div>
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-xs font-bold ring-2 ring-white/20 shadow-md">
          tv
        </div>
      </div>
    </div>
  </header>


  <!-- ================= 主内容容器 ================= -->
  <main class="max-w-[1720px] mx-auto w-full px-6 lg:px-12 py-5 flex-1 flex flex-col space-y-7">
    
    <!-- 1. 顶部沉浸式展台 (Top Shelf Feature Stage) -->
    <section id="topShelf" class="relative w-full h-[230px] rounded-3xl overflow-hidden border border-white/15 shadow-2xl backdrop-blur-xl bg-gradient-to-r from-slate-900/90 via-slate-800/80 to-slate-900/90 transition-all duration-300">
      <!-- 动态背景光晕容器 (JS根据选中卡片注入) -->
      <div id="shelfContent" class="w-full h-full p-7 flex items-center justify-between shelf-animate">
        <!-- 默认动态加载 -->
      </div>
    </section>

    <!-- 2. tvOS Dock 常用推荐栏 (Top Dock Shelf) -->
    <section id="dockSection">
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-star text-amber-400 text-sm"></i>
          <h2 class="text-base font-semibold tracking-wide text-white/90">常驻核心推荐 (Top Favorites)</h2>
        </div>
        <span class="text-xs text-white/40">支持鼠标悬浮或遥控聚焦</span>
      </div>

      <!-- Dock 卡片列表容器 -->
      <div id="dockGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-5 pt-2 pb-5">
        <!-- 动态生成或使用预置卡片 -->
      </div>
    </section>

    <!-- 3. 分类货架展示 (Shelves Container) -->
    <div id="shelvesContainer" class="flex flex-col space-y-7">
      <!-- 动态分类货架注入区域 -->
    </div>

  </main>

  <!-- ================= 模拟 tvOS 弹窗打开提示 ================= -->
  <div id="actionModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-gradient-to-b from-white/15 to-white/5 border border-white/20 p-6 rounded-3xl max-w-sm w-full mx-4 shadow-2xl backdrop-blur-2xl text-center transform scale-95 transition-transform duration-300" id="modalBox">
      <div id="modalIcon" class="w-16 h-16 rounded-2xl mx-auto mb-4 flex items-center justify-center text-3xl text-white shadow-lg bg-blue-600/60 border border-white/20"></div>
      <h3 id="modalTitle" class="text-lg font-bold text-white mb-1">启动应用</h3>
      <p id="modalDesc" class="text-xs text-white/60 mb-5">目标地址: http://...</p>
      <div class="flex space-x-3">
        <button id="modalConfirm" class="flex-1 py-2.5 rounded-xl bg-white text-black font-semibold text-xs hover:bg-slate-200 transition">确定前往</button>
        <button id="modalCancel" class="flex-1 py-2.5 rounded-xl bg-white/10 text-white font-medium text-xs hover:bg-white/20 transition">留在仪表盘</button>
      </div>
    </div>
  </div>

  <!-- 底部微型版本标识 -->
  <footer class="py-3 text-center text-xs text-white/30 border-t border-white/5">
    NAS Stats v2.5.0 • Apple tvOS 大屏纯享控制台
  </footer>

  <!-- ================= JavaScript: 真实数据驱动与 Focus Engine ================= -->
  <script>
    let allServices = [];
    let liveStatsData = {};
    let cards = [];
    let currentFocusIndex = 0;

    // 默认内置的精美展台模板字典
    const presetShelves = {
      fnvideo: {
        bg: 'from-blue-950/80 via-indigo-950/60 to-black/80',
        title: '飞牛影视 · 私有影院',
        sub: '4K HDR · 杜比视界 · 硬件转码加速',
        desc: '支持全自动影视海报墙刮削，智能字幕匹配，蓝光原盘直接解码推流。',
        meta: '<span class="text-xs text-blue-300 bg-blue-500/20 px-2 py-0.5 rounded border border-blue-400/20">4K REMUX 就绪</span>'
      },
      qbittorrent: {
        bg: 'from-blue-950/80 via-slate-900/60 to-black/80',
        title: 'qBittorrent · 高速下载矩阵',
        sub: 'PT/BT 高性能下载引擎 · DHT 屏蔽',
        desc: '支持远程 WebAPI 调度，智能限速，多路径自动归档。',
        meta: '<span class="text-xs text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-400/20">做种与上传中</span>'
      },
      homeassistant: {
        bg: 'from-sky-950/80 via-cyan-950/50 to-black/80',
        title: 'Home Assistant · 全屋智能中枢',
        sub: 'Matter & Zigbee 局域网网关正常',
        desc: '多协议全屋物联网设备纳管，自动化联动规则与家庭影院观影灯光模式就绪。',
        meta: '<span class="text-xs text-cyan-300 bg-cyan-500/20 px-2 py-0.5 rounded border border-cyan-400/20">智能节点在线</span>'
      },
      pve: {
        bg: 'from-orange-950/80 via-stone-900/60 to-black/80',
        title: 'Proxmox VE · 虚拟化计算集群',
        sub: 'KVM 虚拟机 & LXC 容器架构',
        desc: '多节点高可用集群管理，软路由、NAS 底座与容器自动化部署。',
        meta: '<span class="text-xs text-orange-300 bg-orange-500/20 px-2 py-0.5 rounded border border-orange-400/20">宿主节点稳定</span>'
      },
      ikuai: {
        bg: 'from-cyan-950/80 via-sky-950/60 to-black/80',
        title: '爱快 iKuai · 智能流控主路由',
        sub: '多线负载均衡 · 协议分流 · DPI 深度识别',
        desc: '企业级网络吞吐引擎，双向流量瞬时统计与硬件 NAT 加速。',
        meta: '<span class="text-xs text-cyan-300 bg-cyan-500/20 px-2 py-0.5 rounded border border-cyan-400/20">WAN 端口畅通</span>'
      }
    };

    // 展台元素引用
    const shelfEl = document.getElementById('topShelf');
    const shelfContentEl = document.getElementById('shelfContent');

    function updateTopShelf(item) {
      if (!item) return;
      let bg = 'from-slate-900/90 via-slate-800/80 to-slate-900/90';
      let title = item.name || '服务应用';
      let sub = item.description || 'NAS 聚合服务节点';
      let desc = '支持通过电视遥控器或方向键直接启动访问，端口映射及状态自检正常。';
      let metaHtml = `<span class="text-xs text-white/50 bg-white/10 px-2.5 py-1 rounded-lg">内网端口: ${item.port || '80/443'}</span>`;

      // 智能识别监控模块真实数据联动
      const key = (item.name || '').toLowerCase();
      if (key.includes('qbit') && liveStatsData.qbittorrent) {
        const qb = liveStatsData.qbittorrent;
        bg = 'from-blue-950/80 via-slate-900/70 to-black/80';
        title = `qBittorrent · 下载 ${formatSpeed(qb.dl_speed || 0)} / 上传 ${formatSpeed(qb.up_speed || 0)}`;
        sub = `活跃种子: ${qb.dl_torrents ? qb.dl_torrents.length : 0} 个正在同步`;
        desc = qb.dl_torrents && qb.dl_torrents.length > 0 ? 
          `当前首要任务: ${escapeHtml(qb.dl_torrents[0].name || '')} (${Math.round((qb.dl_torrents[0].progress || 0) * 100)}%)` : 
          '所有下载队列已就绪，当前没有活动的拥堵任务。';
        metaHtml = `<span class="text-xs text-emerald-300 bg-emerald-500/20 px-3 py-1 rounded-lg border border-emerald-400/20">总吞吐率: ${formatSpeed((qb.dl_speed || 0) + (qb.up_speed || 0))}</span>`;
      } else if ((key.includes('pve') || key.includes('proxmox')) && liveStatsData.pve) {
        const pve = liveStatsData.pve;
        bg = 'from-orange-950/80 via-stone-900/70 to-black/80';
        title = `Proxmox VE 集群 · 宿主健康度 100%`;
        sub = `CPU 使用率: ${pve.cpu || 0}% · 内存占用: ${pve.mem || 0}%`;
        desc = `节点稳定运行中，已连接虚拟机与 LXC 容器守护进程，IO 延迟保持低位。`;
        metaHtml = `<span class="text-xs text-amber-300 bg-amber-500/20 px-3 py-1 rounded-lg border border-amber-400/20">虚拟化底座</span>`;
      } else if (key.includes('ikuai') && liveStatsData.ikuai) {
        const ik = liveStatsData.ikuai;
        bg = 'from-cyan-950/80 via-sky-950/70 to-black/80';
        title = `爱快 iKuai 路由 · 网络状态正常`;
        sub = `总下行: ${formatSpeed(ik.dl_speed || 0)} · 总上行: ${formatSpeed(ik.up_speed || 0)}`;
        desc = `CPU: ${ik.cpu || 0}% · 内存: ${ik.mem || 0}% · 当前总连接数: ${ik.connect_num || '-'}`;
        metaHtml = `<span class="text-xs text-cyan-300 bg-cyan-500/20 px-3 py-1 rounded-lg border border-cyan-400/20">WAN 聚合</span>`;
      } else if (key.includes('home') || key.includes('ha')) {
        bg = 'from-sky-950/80 via-cyan-950/70 to-black/80';
        title = `Home Assistant · 全屋智能中心`;
        sub = `智能体在线 · Zigbee 网关已连接`;
        desc = `已自动发现全屋环境传感器、空调网关、智能照明与安防联动配置。`;
        metaHtml = `<span class="text-xs text-sky-300 bg-sky-500/20 px-3 py-1 rounded-lg border border-sky-400/20">智能家居</span>`;
      } else if (item.key && presetShelves[item.key]) {
        const p = presetShelves[item.key];
        bg = p.bg; title = p.title; sub = p.sub; desc = p.desc; metaHtml = p.meta;
      }

      shelfEl.className = `relative w-full h-[230px] rounded-3xl overflow-hidden border border-white/15 shadow-2xl backdrop-blur-xl bg-gradient-to-r ${bg} transition-all duration-300`;
      shelfContentEl.innerHTML = `
        <div class="space-y-3 z-10 max-w-2xl">
          <div class="flex items-center space-x-2">
            <span class="bg-white/10 text-white/90 text-[10px] px-2 py-0.5 rounded font-medium border border-white/15">tvOS 即时聚焦</span>
            <span class="text-xs text-white/50">${sub}</span>
          </div>
          <h1 class="text-2xl font-bold tracking-tight text-white drop-shadow">${escapeHtml(title)}</h1>
          <p class="text-xs text-white/70 line-clamp-2 leading-relaxed">${escapeHtml(desc)}</p>
        </div>
        <div class="hidden md:flex flex-col items-end space-y-3 z-10 text-right">
          <div class="flex items-center space-x-2">${metaHtml}</div>
          <button onclick="openLaunchModal('${encodeURIComponent(JSON.stringify(item))}')" class="bg-white text-black hover:bg-slate-200 text-xs font-semibold px-5 py-2.5 rounded-xl transition shadow flex items-center space-x-2">
            <i class="fa-solid fa-play text-[10px]"></i>
            <span>立即前往应用</span>
          </button>
        </div>
      `;
      shelfContentEl.classList.remove('shelf-animate');
      void shelfContentEl.offsetWidth;
      shelfContentEl.classList.add('shelf-animate');
    }

    // ─── 速度与容量格式化 ───
    function formatSpeed(bytesPerSec) {
      if (!bytesPerSec || bytesPerSec === 0) return '0.0 B/s';
      const units = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
      const i = Math.floor(Math.log(bytesPerSec) / Math.log(1024));
      return (bytesPerSec / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ─── 获取真实数据并渲染货架 ───
    async function loadData() {
      try {
        const res = await fetch('/api/services');
        const data = await res.json();
        allServices = Array.isArray(data) ? data : (data.services || []);
      } catch (e) {
        allServices = [];
      }

      // 如果没有任何自定义服务，提供预置示范
      if (allServices.length === 0) {
        allServices = [
          { key: 'fnvideo', name: '飞牛影视', port: 5000, category: 'media', icon: '🎬', url: 'http://' + location.hostname + ':5000' },
          { key: 'qbittorrent', name: 'qBittorrent', port: 8080, category: 'tools', icon: '⚡', url: 'http://' + location.hostname + ':8080' },
          { key: 'homeassistant', name: 'Home Assistant', port: 8123, category: 'tools', icon: '🏡', url: 'http://' + location.hostname + ':8123' },
          { key: 'pve', name: 'Proxmox VE', port: 8006, category: 'network', icon: '📦', url: 'https://' + location.hostname + ':8006' },
          { key: 'ikuai', name: '爱快路由', port: 80, category: 'network', icon: '🌐', url: 'http://192.168.1.1' }
        ];
      }

      renderAllCards();
    }

    // ─── 渲染卡片与分类货架 ───
    function renderAllCards() {
      const dockGrid = document.getElementById('dockGrid');
      const shelvesContainer = document.getElementById('shelvesContainer');

      // 前 5 个作为常驻核心 Dock
      const dockList = allServices.slice(0, 5);
      const restList = allServices.slice(5);

      dockGrid.innerHTML = dockList.map((item, idx) => generateCardHtml(item, idx, true)).join('');

      // 按分类整理
      const categories = {
        media: { title: '影音视听与串流 (Media & Streaming)', icon: 'fa-clapperboard', color: 'text-indigo-400', items: [] },
        network: { title: '网络管控与虚拟化底座 (Network & Infrastructure)', icon: 'fa-server', color: 'text-cyan-400', items: [] },
        tools: { title: '自动化运维与工具链 (Automation & Tools)', icon: 'fa-bolt', color: 'text-emerald-400', items: [] },
        other: { title: '更多服务与扩展 (Extended Services)', icon: 'fa-shapes', color: 'text-amber-400', items: [] }
      };

      restList.forEach(item => {
        const cat = (item.category || '').toLowerCase();
        if (cat.includes('media') || cat.includes('video') || cat.includes('music')) categories.media.items.push(item);
        else if (cat.includes('net') || cat.includes('route') || cat.includes('pve')) categories.network.items.push(item);
        else if (cat.includes('tool') || cat.includes('down') || cat.includes('pt')) categories.tools.items.push(item);
        else categories.other.items.push(item);
      });

      let shelvesHtml = '';
      for (const [key, group] of Object.entries(categories)) {
        if (group.items.length === 0) continue;
        shelvesHtml += `
          <section>
            <div class="flex items-center space-x-2.5 mb-3 px-1">
              <i class="fa-solid ${group.icon} ${group.color} text-sm"></i>
              <h2 class="text-base font-semibold tracking-wide text-white/90">${group.title}</h2>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4.5 pt-1 pb-4">
              ${group.items.map((it, idx) => generateCardHtml(it, idx, false)).join('')}
            </div>
          </section>
        `;
      }

      shelvesContainer.innerHTML = shelvesHtml;

      // 重新绑定 3D 偏转、光泽与遥控焦点引擎
      bindTvosInteractions();

      // 默认将展台展示为第一个核心服务
      if (allServices.length > 0) {
        updateTopShelf(allServices[0]);
      }
    }

    function generateCardHtml(item, idx, isDock) {
      const iconSrc = item.favicon || item.icon;
      const isImg = iconSrc && (iconSrc.startsWith('http') || iconSrc.startsWith('data:image'));
      const iconRender = isImg ? 
        `<img src="${escapeHtml(iconSrc)}" class="w-10 h-10 rounded-xl object-contain shadow" alt="">` : 
        `<span class="text-3xl">${escapeHtml(item.icon || '🚀')}</span>`;

      const aspectClass = isDock ? 'aspect-[16/10]' : 'aspect-[4/3]';
      const gradients = [
        'from-blue-600 via-indigo-600 to-purple-700',
        'from-emerald-600 via-teal-700 to-slate-900',
        'from-sky-600 via-blue-800 to-slate-900',
        'from-amber-600 via-orange-700 to-neutral-900',
        'from-purple-600 via-indigo-800 to-zinc-900',
        'from-rose-600 via-pink-700 to-slate-900'
      ];
      const grad = gradients[idx % gradients.length];

      return `
        <div tabindex="0" data-service='${encodeURIComponent(JSON.stringify(item))}'
             class="tvos-card group cursor-pointer flex flex-col items-center">
          <div class="card-glare"></div>
          <div class="w-full ${aspectClass} rounded-[22px] bg-gradient-to-br ${grad} p-4 flex flex-col justify-between border border-white/20 shadow-lg relative overflow-hidden">
            <div class="flex justify-between items-start z-10">
              <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/30 text-white shadow">
                ${iconRender}
              </div>
              <span class="text-[10px] bg-white/25 backdrop-blur-md px-2 py-0.5 rounded-full font-medium text-white/90">:${item.port || '80'}</span>
            </div>
            <div class="z-10">
              <span class="text-[11px] text-white/70 font-medium block truncate">${escapeHtml(item.description || item.category || '应用')}</span>
              <h3 class="text-base font-bold text-white tracking-wide truncate">${escapeHtml(item.name)}</h3>
            </div>
          </div>
          <span class="card-title text-xs mt-2.5 text-white/70 font-medium transition duration-200 truncate max-w-full">${escapeHtml(item.name)}</span>
        </div>
      `;
    }

    // ─── 绑定 3D 偏转、光斑与键盘遥控焦点 ───
    function bindTvosInteractions() {
      cards = Array.from(document.querySelectorAll('.tvos-card'));

      cards.forEach((card, index) => {
        // 鼠标在卡片上悬浮时的 3D 微倾斜计算
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          const rotateX = ((y - centerY) / centerY) * -9;
          const rotateY = ((x - centerX) / centerX) * 9;

          card.style.transform = `scale(1.11) translateY(-6px) perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
          
          const glare = card.querySelector('.card-glare');
          if (glare) {
            glare.style.background = `radial-gradient(circle at ${(x / rect.width) * 100}% ${(y / rect.height) * 100}%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 60%)`;
          }
        });

        card.addEventListener('mouseleave', () => {
          if (!card.classList.contains('focused')) {
            card.style.transform = '';
          } else {
            card.style.transform = 'scale(1.11) translateY(-6px)';
          }
        });

        card.addEventListener('focus', () => focusCard(index));
        card.addEventListener('mouseenter', () => focusCard(index));

        card.addEventListener('click', () => {
          const jsonStr = card.getAttribute('data-service');
          if (jsonStr) openLaunchModal(jsonStr);
        });
      });
    }

    function focusCard(index) {
      if (!cards[index]) return;
      cards.forEach((c, i) => {
        if (i === index) {
          c.classList.add('focused');
          const jsonStr = c.getAttribute('data-service');
          if (jsonStr) {
            try {
              const item = JSON.parse(decodeURIComponent(jsonStr));
              updateTopShelf(item);
            } catch (e) {}
          }
        } else {
          c.classList.remove('focused');
          c.style.transform = '';
        }
      });
      currentFocusIndex = index;
    }

    // ─── 遥控器与键盘上下左右导航 ───
    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('actionModal');
      const isModalOpen = !modal.classList.contains('pointer-events-none');
      if (isModalOpen) {
        if (e.key === 'Escape') closeModal();
        if (e.key === 'Enter') document.getElementById('modalConfirm').click();
        return;
      }

      if (document.activeElement === document.getElementById('searchInput')) {
        if (e.key === 'Escape') document.getElementById('searchInput').blur();
        return;
      }

      if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'Enter'].includes(e.key)) {
        e.preventDefault();
      }

      if (cards.length === 0) return;

      if (e.key === 'ArrowRight') {
        let next = (currentFocusIndex + 1) % cards.length;
        cards[next].focus();
      } else if (e.key === 'ArrowLeft') {
        let prev = (currentFocusIndex - 1 + cards.length) % cards.length;
        cards[prev].focus();
      } else if (e.key === 'ArrowDown') {
        let down = Math.min(currentFocusIndex + 5, cards.length - 1);
        cards[down].focus();
      } else if (e.key === 'ArrowUp') {
        let up = Math.max(currentFocusIndex - 5, 0);
        cards[up].focus();
      } else if (e.key === 'Enter') {
        const jsonStr = cards[currentFocusIndex]?.getAttribute('data-service');
        if (jsonStr) openLaunchModal(jsonStr);
      }
    });

    // ─── 弹窗与应用启动 ───
    let currentLaunchUrl = '';
    const actionModal = document.getElementById('actionModal');
    const modalBox = document.getElementById('modalBox');

    function openLaunchModal(jsonStr) {
      try {
        const item = JSON.parse(decodeURIComponent(jsonStr));
        const url = item.url || (location.protocol + '//' + location.hostname + (item.port ? ':' + item.port : ''));
        currentLaunchUrl = url;

        document.getElementById('modalTitle').innerText = `启动 ${item.name}`;
        document.getElementById('modalDesc').innerText = `前往目标: ${url}`;
        
        const iconSrc = item.favicon || item.icon;
        const isImg = iconSrc && (iconSrc.startsWith('http') || iconSrc.startsWith('data:image'));
        document.getElementById('modalIcon').innerHTML = isImg ? 
          `<img src="${escapeHtml(iconSrc)}" class="w-12 h-12 object-contain" alt="">` : 
          `<span class="text-3xl">${escapeHtml(item.icon || '🚀')}</span>`;

        actionModal.classList.remove('opacity-0', 'pointer-events-none');
        modalBox.classList.remove('scale-95');
        modalBox.classList.add('scale-100');
      } catch (e) {}
    }

    function closeModal() {
      actionModal.classList.add('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-100');
      modalBox.classList.add('scale-95');
    }

    document.getElementById('modalCancel').onclick = closeModal;
    document.getElementById('modalConfirm').onclick = () => {
      closeModal();
      if (currentLaunchUrl) window.open(currentLaunchUrl, '_blank');
    };

    // ─── 搜索过滤 ───
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase().trim();
      cards.forEach(card => {
        const title = card.querySelector('.card-title')?.innerText.toLowerCase() || '';
        if (title.includes(val)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    });

    // ─── 时钟与周期刷新监控数据 ───
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('liveClock').innerText = `${hours}:${minutes}`;

      const months = now.getMonth() + 1;
      const date = now.getDate();
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      document.getElementById('liveDate').innerText = `${months}月${date}日 ${weekdays[now.getDay()]}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function pollStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        liveStatsData = data || {};

        // 刷新总吞吐
        let totalDown = 0;
        let totalUp = 0;
        if (data.ikuai) {
          totalDown = data.ikuai.dl_speed || 0;
          totalUp = data.ikuai.up_speed || 0;
        } else if (data.qbittorrent) {
          totalDown = data.qbittorrent.dl_speed || 0;
          totalUp = data.qbittorrent.up_speed || 0;
        }
        document.getElementById('statDown').innerText = formatSpeed(totalDown);
        document.getElementById('statUp').innerText = formatSpeed(totalUp);

        // 刷新 PVE 状态
        if (data.pve && data.pve.enabled !== false) {
          document.getElementById('statPveCpu').innerText = (data.pve.cpu ? data.pve.cpu + '%' : '--%');
          document.getElementById('statPveMem').innerText = (data.pve.mem ? data.pve.mem + '%' : '--%');
        }

        // 刷新 HA 状态
        if (data.homeassistant && data.homeassistant.enabled !== false) {
          document.getElementById('statHaText').innerText = `HA ${data.homeassistant.entities_count || '智能'} 节点`;
        }
      } catch (e) {}
    }
    setInterval(pollStats, 3000);
    pollStats();

    // 启动初始加载
    loadData();
  </script>
</body>
</html>
